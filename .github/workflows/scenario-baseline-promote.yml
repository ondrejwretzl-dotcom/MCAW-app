name: Scenario Baseline Promote

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID that produced mcaw-scenario-report artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name"
        required: true
        default: "mcaw-scenario-report"
        type: string
      baseline_id:
        description: "Baseline ID (e.g., commit SHA or timestamp)"
        required: true
        type: string
      suite:
        description: "engine_only | e2e | both"
        required: true
        default: "both"
        type: choice
        options:
          - engine_only
          - e2e
          - both
      catalog:
        description: "Baseline catalog namespace"
        required: true
        default: "default"
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download report artifact from run
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: .tmp/scenario-report

      - name: Locate summaries
        id: summary
        run: |
          ENGINE="$(find .tmp/scenario-report -name summary_engine_only.json -type f | head -n1)"
          E2E="$(find .tmp/scenario-report -name summary_e2e.json -type f | head -n1)"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"

      - name: Promote baseline
        run: |
          scripts/mcaw/promote_baseline.sh \
            "${{ steps.summary.outputs.engine }}" \
            "${{ steps.summary.outputs.e2e }}" \
            "${{ inputs.baseline_id }}" \
            "${{ inputs.catalog }}" \
            "${{ inputs.suite }}"

      - name: Commit promoted baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/baselines
          git commit -m "Promote scenario baseline ${{ inputs.catalog }}/${{ inputs.baseline_id }}" || {
            echo "No changes to commit";
            exit 0;
          }
          git push
