name: Scenario Regression

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scenario-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SIM regression
        working-directory: sim
        run: |
          npm ci
          npm run build

      - name: log_analyzer regression
        working-directory: log_analyzer
        run: |
          npm ci
          npm test
          npm run build

      - name: Android compile checks
        run: |
          ./gradlew :app:compileDebugKotlin
          ./gradlew :app:processDebugResources

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-regression-artifacts
          path: |
            sim/dist
            log_analyzer/dist
