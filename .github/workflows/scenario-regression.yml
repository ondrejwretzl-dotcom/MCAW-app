name: Scenario Regression

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scenario-compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Run scenario compare
        id: compare
        continue-on-error: true
        env:
          FAIL_ON_HARD: "true"
          FAIL_ON_SCENARIO: "false"
        run: scripts/mcaw/scenario_compare_ci.sh

      - name: Locate latest scenario report directory
        if: always()
        id: locate
        run: |
          REPORT_ROOT="app/build/reports/mcaw_scenarios"
          if [[ ! -d "$REPORT_ROOT" ]]; then
            REPORT_ROOT="build/reports/mcaw_scenarios"
          fi

          LATEST=""
          if [[ -d "$REPORT_ROOT" ]]; then
            LATEST="$(find "$REPORT_ROOT" -mindepth 1 -maxdepth 1 -type d | sort | tail -n1)"
          fi

          echo "latest_report_dir=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Upload scenario report artifact
        if: always() && steps.locate.outputs.latest_report_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: mcaw-scenario-report
          path: ${{ steps.locate.outputs.latest_report_dir }}
          if-no-files-found: error

      - name: Prepare Pages content
        if: always() && steps.locate.outputs.latest_report_dir != ''
        run: |
          rm -rf .pages
          mkdir -p .pages
          cp -R "${{ steps.locate.outputs.latest_report_dir }}"/* .pages/

      - name: Upload Pages artifact
        if: always() && steps.locate.outputs.latest_report_dir != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        if: always() && steps.locate.outputs.latest_report_dir != ''
        uses: actions/deploy-pages@v4

      - name: Job summary
        if: always()
        run: |
          {
            echo "## MCAW Scenario Report"
            echo "- Artifact: **mcaw-scenario-report**"
            echo "- Report dir: \`${{ steps.locate.outputs.latest_report_dir }}\`"
            echo "- Compare outcome: **${{ steps.compare.outcome }}**"
            if [[ -n "${{ steps.deployment.outputs.page_url }}" ]]; then
              echo "- GitHub Pages: ${{ steps.deployment.outputs.page_url }}"
            else
              echo "- GitHub Pages: not deployed (missing report output)."
            fi
            echo "- Open **index.html** (includes RUNBOOK.md link)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce compare result
        if: always()
        run: |
          if [[ "${{ steps.compare.outcome }}" != "success" ]]; then
            echo "Scenario compare failed (outcome=${{ steps.compare.outcome }})." >&2
            exit 1
          fi
